name: macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dmg:
    name: DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            note: Apple Silicon
          - arch: x86_64
            runner: macos-15-intel
            note: Intel (last x86_64 image, available until Aug 2027)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show interpreter
        run: |
          python -VV
          uname -m

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter matplotlib pdfplumber openpyxl \
            requests websocket-client pyinstaller

      - name: Logic tests
        run: python check_ledger.py

      - name: Build application bundle
        run: |
          python tools/make_icon.py
          mkdir -p build/icon.iconset
          sips -z 16 16 assets/ledger-1024.png --out build/icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/ledger-1024.png --out build/icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/ledger-1024.png --out build/icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/ledger-1024.png --out build/icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/ledger-1024.png --out build/icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/ledger-1024.png --out build/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/ledger-1024.png --out build/icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/ledger-1024.png --out build/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/ledger-1024.png --out build/icon.iconset/icon_512x512.png >/dev/null
          cp assets/ledger-1024.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o assets/ledger.icns

          pyinstaller --noconfirm --clean --windowed --name Ledger \
            --icon assets/ledger.icns \
            --add-data "assets/ledger-256.png:assets" \
            --collect-all customtkinter \
            --collect-all matplotlib \
            --collect-data pdfplumber \
            --collect-data pdfminer \
            --collect-data openpyxl \
            --hidden-import websocket \
            --hidden-import PIL._tkinter_finder \
            --exclude-module PyQt5 --exclude-module PySide6 \
            --exclude-module IPython --exclude-module pytest \
            ledger.py

      - name: Check the bundle
        run: |
          test -d "dist/Ledger.app" || (echo "no app bundle produced" && exit 1)
          test -x "dist/Ledger.app/Contents/MacOS/Ledger" || (echo "no executable inside" && exit 1)
          file "dist/Ledger.app/Contents/MacOS/Ledger"
          ls -lh "dist/Ledger.app/Contents/MacOS/Ledger"

      - name: Build DMG
        run: |
          VERSION=$(python tools/version.py)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/dmg
          cp -R "dist/Ledger.app" "dist/dmg/Ledger.app"
          ln -s /Applications "dist/dmg/Applications"
          hdiutil create -volname "Ledger" -srcfolder "dist/dmg" -ov -format UDZO \
            "dist/Ledger-${VERSION}-${{ matrix.arch }}.dmg"
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
